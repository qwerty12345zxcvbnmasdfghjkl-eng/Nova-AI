<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a1a;
      color: #ececec;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #202123;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #333;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 85%;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .ai-message {
      background-color: #2a2b32;
      align-self: flex-start;
      border: 1px solid #3f4047;
    }
    .user-message {
      background-color: #10a37f;
      color: white;
      align-self: flex-end;
    }
    #input-area {
      padding: 15px;
      background-color: #202123;
      display: flex;
      gap: 10px;
      border-top: 1px solid #333;
    }
    #user-input {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #3f4047;
      background-color: #40414f;
      color: white;
      outline: none;
      font-size: 1rem;
    }
    #user-input:focus { border-color: #10a37f; }
    button {
      background-color: #10a37f;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background-color: #1a7f64; }
  </style>
</head>
<body>

  <header>Nova AI</header>

  <div id="chat-container">
    <div class="message ai-message">
      Hello! Main Nova AI hoon. Aaj main aapki kya madad kar sakta hoon?
    </div>
  </div>

  <div id="input-area">
    <input type="text" id="user-input" placeholder="Apna message likhein..." autocomplete="off">
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const inputField = document.getElementById('user-input');
      const chatContainer = document.getElementById('chat-container');
      const messageText = inputField.value.trim();

      if (messageText === "") return;

      // User ka message add karein
      const userMsgDiv = document.createElement('div');
      userMsgDiv.className = 'message user-message';
      userMsgDiv.innerText = messageText;
      chatContainer.appendChild(userMsgDiv);

      inputField.value = '';

      // AI ka thora sa wait karke jawab (Abhi ke liye static, baad mein backend se aayega)
      setTimeout(() => {
        const aiMsgDiv = document.createElement('div');
        aiMsgDiv.className = 'message ai-message';
        aiMsgDiv.innerText = "Yeh abhi frontend demo hai. Backend connect hone ke baad main aapko asal AI ka jawab dunga!";
        chatContainer.appendChild(aiMsgDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 1000);
      
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Enter button dabane par message send ho
    document.getElementById('user-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
  </html>
