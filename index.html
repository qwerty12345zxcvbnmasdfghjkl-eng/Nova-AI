<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nova AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Link to CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>Nova AI</header>

  <div id="chat-container">
    <div class="message ai-message">
      <div class="avatar ai-avatar">N</div>
      <div class="message-content">
        Hello! Main Nova AI hoon. Aaj main aapki kya madad kar sakta hoon?
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-wrapper">
      <input type="text" id="user-input" placeholder="Message Nova..." autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
  </div>

  <!-- Link to JS file -->
  <script src="script.js"></script>
</body>
                            </html>
