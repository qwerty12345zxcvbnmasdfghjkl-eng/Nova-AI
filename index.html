<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nova AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #212121;
      color: #ececec;
      height: 100vh;
      height: 100dvh; /* Mobile browsers ke liye fix */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Header */
    header {
      padding: 16px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      color: #d1d5db;
      border-bottom: 1px solid #333;
      background-color: #212121;
      z-index: 10;
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 12px;
      max-width: 90%;
      line-height: 1.6;
      font-size: 0.95rem;
      animation: fadeIn 0.3s ease-out;
    }
    .user-message {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .message-content {
      padding: 12px 16px;
      border-radius: 12px;
    }
    .user-message .message-content {
      background-color: #2f2f2f;
      border-radius: 12px 12px 2px 12px;
    }
    .ai-message .message-content {
      background-color: transparent;
      padding-left: 0;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .ai-avatar {
      background: linear-gradient(135deg, #10a37f, #0d8a6a);
      color: white;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .user-avatar {
      background-color: #5c5c5c;
      color: white;
      font-size: 0.8rem;
    }

    /* Input Area */
    #input-area {
      padding: 12px 16px 20px 16px;
      background-color: #212121;
      position: relative;
    }
    .input-wrapper {
      display: flex;
      align-items: flex-end;
      background-color: #2f2f2f;
      border-radius: 24px;
      padding: 8px 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ececec;
      font-size: 1rem;
      resize: none;
      outline: none;
      padding: 8px 12px;
      max-height: 120px;
      min-height: 24px;
      line-height: 1.5;
    }
    #user-input::placeholder { color: #888; }
    #send-btn {
      background-color: #ececec;
      color: #212121;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 2px;
      transition: all 0.2s;
    }
    #send-btn:active { transform: scale(0.9); background-color: #ccc; }
    #send-btn svg { width: 18px; height: 18px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>Nova AI</header>

  <div id="chat-container">
    <!-- Welcome Message -->
    <div class="message ai-message">
      <div class="avatar ai-avatar">N</div>
      <div class="message-content">
        Hello! Main Nova AI hoon. Aaj main aapki kya madad kar sakta hoon?
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-wrapper">
      <input type="text" id="user-input" placeholder="Message Nova..." autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
      </button>
    </div>
  </div>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const inputField = document.getElementById('user-input');

    function sendMessage() {
      const messageText = inputField.value.trim();
      if (messageText === "") return;

      // 1. Add User Message
      addMessage(messageText, 'user');
      inputField.value = '';

      // 2. Simulate AI Thinking & Reply
      setTimeout(() => {
        addMessage("Yeh frontend demo hai. Jab hum backend aur API connect karenge, tab main aapko asal AI ka jawab dunga!", 'ai');
      }, 1000);
    }

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}-message`;

      const avatarDiv = document.createElement('div');
      avatarDiv.className = `avatar ${sender}-avatar`;
      avatarDiv.innerText = sender === 'ai' ? 'N' : 'U';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerText = text;

      msgDiv.appendChild(avatarDiv);
      msgDiv.appendChild(contentDiv);
      
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Enter dabane par send ho
    inputField.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
  </html>
